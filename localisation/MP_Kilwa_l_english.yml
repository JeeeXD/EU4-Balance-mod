 zan_rivalries_title: "Inland Rivalries"
 zan_rivalries_desc: "While we have overwhelming maritime presence, trade would flow more efficiently if we can directly control the inland roads. Business is business, even if it means war."

 zan_coasts_of_zanz_title: "Coasts of Zanzibar"
 zan_coasts_of_zanz_desc: "The Sunni nations to our north shall find it difficult to hold their grounds against the neighboring heathens. Let us offer our support in return for a small favor."

 zan_sofala_title: "Southern Autonomy"
 zan_sofala_desc: "Merchants of Sofala value their autonomy, but no longer shall they maintain influence. We shall test their loyalty and make sure they kneel to the crown."

 zan_war_prep_title: "Prepare for War"
 zan_war_prep_desc: "Practicing our militaristic might requires the approval of our people and their willingness to expend their resources. Let it be known they will be paid back tenfold."

 zan_vassals_0_title: "Unified Territories"
 zan_vassals_0_desc: "Blood need not be shed within Kilwa's realm, as the nation and its subjects shall benefit more from mutual prosperity and shared religion."

 zan_mutapa_title: "Crush Mutapa"
 zan_mutapa_desc: "We have stomped down on our biggest threat, and have proven ourselves powerful enough to punish infidels and raiders. Now the region shall fear our might."

